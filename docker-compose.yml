services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123!"
    ports:
      - "1433:1433"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=ECommerceDb;User Id=sa;Password=Your_password123!;TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=true"
      Jwt__Key: "CHANGE_ME_DEV_ONLY__USE_ENV_VAR_IN_PROD"
      Jwt__Issuer: "ECommerce.Web"
      Jwt__Audience: "ECommerce.Web"
      Jwt__ExpiryMinutes: "60"
    ports:
      - "8080:8080"
